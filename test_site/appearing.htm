<html>
<head>
    <script type="text/javascript">
        setHover = function () {
            document.getElementById("container").onmouseover = function () {
                document.getElementById("willBecomeVisible").style.display = 'block'
            }

            document.getElementById("container").onmouseout = function () {
                document.getElementById("willBecomeVisible").style.display = 'none'
            }
        }
    </script>
    <title>Appearing Page</title>
</head>
<body onload="setHover()">
<h1>Appearing Page!</h1>
<div id="container" style="display: block;">
    <span id="willBecomeVisible" style="display: none">Text that only visible after hovering container</span>
    <span id="alwaysVisibleText">Always visible text</span>
</div>
</body>
</html>
